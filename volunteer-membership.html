<style>
:root{color-scheme:only light;--ink:#26302b;--paper:#eef3ee;--paper2:#dde8df;--olive:#2f7a5a;--deep:#17402f;--gold:#c28a2c;--line:rgba(38,48,43,.16);--danger:#9c3b2e;--ok:#2f7a5a;--r:16px}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tajawal,Cairo,Arial,sans-serif;line-height:1.6;min-height:100vh}
.app{max-width:1180px;margin:auto;padding:16px 14px 60px}
.mast{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;background:var(--deep);color:#fff;border-radius:var(--r);margin-bottom:18px;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:12px}.mark{width:60px;height:60px;border-radius:50%;background:#fff;border:2px solid var(--gold);flex:none;overflow:hidden;padding:0;display:block}
.brand h1{font-size:16px;margin:0}.brand p{font-size:11px;margin:2px 0 0;opacity:.75}
.session{font-size:12px;background:#ffffff18;padding:7px 10px;border-radius:999px;display:flex;gap:8px;align-items:center}.session button{border:1px solid #ffffff55;background:transparent;color:#fff;border-radius:999px;padding:4px 10px;font-family:inherit;cursor:pointer}
h2,h3{font-family:Cairo,sans-serif;color:var(--deep)}h2{font-size:24px;margin:5px 0 8px}
.eyebrow{color:var(--gold);font-weight:800;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card,.panel,.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.choice{cursor:pointer;transition:.15s}.choice:hover{transform:translateY(-2px);box-shadow:0 8px 24px #00000012;border-color:var(--olive)}.choice h3{margin:8px 0 5px;font-size:18px}.choice p{font-size:13px;color:#5b6a62;margin:0}.num{color:var(--gold);font-weight:900}
.herologin{max-width:440px;margin:22px auto 10px;text-align:center}
.mark2{width:140px;height:140px;border-radius:50%;background:#fff;border:3px solid var(--gold);display:block;margin:0 auto 16px;box-shadow:0 6px 18px rgba(194,138,44,.25);overflow:hidden;padding:0}
.divider{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--gold);margin:8px 0 14px}.divider span{width:46px;height:1px;background:var(--gold);display:inline-block}
.sub{color:#5b6a62;font-size:13px;margin-bottom:18px}
.markico{width:96px;height:96px;border-radius:50%;background:#fff;border:3px solid var(--gold);display:grid;place-items:center;margin:0 auto 16px;box-shadow:0 6px 18px rgba(194,138,44,.25)}
.herologin .panel{text-align:right}
.field{margin:0 0 14px}.field label{display:block;font-size:12.5px;font-weight:800;margin-bottom:5px}.hint{font-size:11px;color:#7a8780}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select{width:100%;padding:12px 18px;border:1.5px solid var(--line);border-radius:999px;background:#fbfdfb;font-family:inherit;font-size:14px}
textarea{width:100%;padding:11px 16px;border:1.5px solid var(--line);border-radius:16px;background:#fbfdfb;font-family:inherit;font-size:14px;min-height:75px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,138,44,.18)}
input[type=file]{padding:9px 14px;border-radius:14px}
.btn{border:0;border-radius:999px;padding:12px 22px;background:var(--olive);color:#fff;font-family:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(23,64,47,.25);font-size:14px}.btn:hover{background:var(--deep)}
.outline{background:#fff;color:var(--olive);border:1.5px solid var(--olive);box-shadow:none}.outline:hover{background:#eaf4ee}
.danger{background:var(--danger)}.small{padding:7px 13px;font-size:12px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.msg{padding:11px 13px;border-radius:12px;margin-bottom:14px;font-size:13px}.err{background:#f8e8e5;color:var(--danger);border:1px solid var(--danger)}.ok{background:#e6f2ea;color:var(--deep);border:1px solid var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}.chip{padding:7px 14px;border:1.5px solid var(--line);border-radius:999px;font-size:13px;cursor:pointer;background:#fff;user-select:none}.chip.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.pv{display:none;width:96px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin-top:8px}
.pvid{width:160px;height:auto;max-height:110px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat{text-align:center;padding:13px}.stat b{display:block;font:900 25px Cairo;color:var(--deep)}.stat span{font-size:11px;color:#777}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.search{flex:1;min-width:190px}.toolbar select{width:auto;min-width:130px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
table{width:100%;border-collapse:collapse;min-width:720px;font-size:13px}th{background:var(--paper2);text-align:right;padding:9px;position:sticky;top:0}td{padding:9px;border-bottom:1px solid var(--line);vertical-align:middle}
.empty{text-align:center;padding:35px;color:#8a938d}
.modalbg{position:fixed;inset:0;background:#10241b99;display:grid;place-items:center;padding:14px;z-index:50}
.modal{width:min(660px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700}.b-on{background:#dff1e5;color:#1f6b45}.b-off{background:#f1e1de;color:var(--danger)}
.back{display:inline-block;color:var(--olive);font-weight:800;font-size:13px;cursor:pointer;margin-bottom:12px}
.idbox{border:2px dashed var(--olive);border-radius:12px;padding:10px;text-align:center;cursor:zoom-in;background:#f6faf7}.idbox img{max-width:100%;max-height:150px;border-radius:8px}
.dhead{display:flex;gap:14px;align-items:center;margin-bottom:12px}.dhead img{width:84px;height:104px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.ntable{min-width:0;margin-bottom:10px}.ntable td{padding:7px 10px;border:1px solid #dbe3dd;font-size:13px}.ntable td.lbl{width:130px;font-weight:700;background:#f2f7f3}
.chk{font-size:12px;color:#5b6a62}
@media(max-width:760px){.grid2,.grid3,.row2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.session{font-size:10px}.app{padding:10px 9px 40px}.brand h1{font-size:14px}}

.progress{display:flex;gap:6px;margin:6px 0 18px}
.pstep{flex:1;text-align:center;font-size:11px;color:#8a938d;border-top:4px solid var(--line);padding-top:6px;line-height:1.3}
.pstep.cur{color:var(--deep);border-color:var(--gold);font-weight:800}.pstep.done{border-color:var(--olive);color:var(--olive)}
.stephead{font:800 16px Cairo,sans-serif;color:var(--deep);margin-bottom:14px}
.yn{display:flex;gap:8px;margin-bottom:8px}.yn button{flex:1;padding:10px;border:1.5px solid var(--line);background:#fff;border-radius:999px;font-family:inherit;font-weight:800;cursor:pointer;font-size:14px}.yn button.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.lrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}.lnum{font-weight:800;color:var(--olive);width:20px}
body{-webkit-tap-highlight-color:transparent}
@supports(padding:max(0px)){.app{padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(60px,env(safe-area-inset-bottom))}}
@media(display-mode:standalone){body{overscroll-behavior-y:contain;user-select:none;-webkit-user-select:none}input,textarea,select{user-select:text;-webkit-user-select:text}}
.sesstxt{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;display:inline-block;vertical-align:bottom}
.flink{color:var(--olive);font-weight:800;font-size:13px;text-decoration:underline;cursor:pointer}
/* ورقة البطاقة (للمعاينة وPDF) */
.psheet{width:720px;font-family:Tajawal,Cairo,Arial,sans-serif;direction:rtl;color:#161a14;padding:14px;background:#fff}
.phead{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #17402f;padding-bottom:12px;margin-bottom:16px}
.phead h1{font-family:Cairo,sans-serif;font-size:19px;margin:0 0 3px;color:#17402f}.phead p{font-size:12px;margin:0;color:#444}
.plogo{width:74px;height:74px;border-radius:50%;object-fit:cover}
.psheet h2{font-family:Cairo,sans-serif;font-size:16px;margin:0 0 12px;color:#17402f}
.pbody{display:flex;gap:16px;align-items:flex-start}
.pphoto{width:140px;height:176px;object-fit:cover;border:2px solid #17402f;border-radius:8px;flex:none;background:#eee}
.pinfo{width:100%;border-collapse:collapse;min-width:0}.pinfo td{border:1px solid #ccc;padding:8px 10px;font-size:13px;vertical-align:top}.pinfo td.lbl{background:#e9f1ec;font-weight:800;width:120px}
.pqr{display:flex;align-items:center;gap:14px;margin-top:16px;border-top:1px solid #ddd;padding-top:12px;font-size:12px;color:#444}.pqr img{width:110px;height:110px}
.pfoot{font-size:10.5px;color:#777;margin-top:14px;border-top:1px solid #ddd;padding-top:8px;display:flex;justify-content:space-between}

function logo(){return `<img src="${LOGO}" alt="شعار" style="display:block;width:100%;height:100%;object-fit:cover">`}
function icon(sz){return `<svg width="${sz}" height="${Math.round(sz*0.8)}" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg"><path d="M50 72C20 50 8 36 8 22a18 18 0 0 1 34-8l8 14 8-14a18 18 0 0 1 34 8c0 14-12 28-42 50z" fill="currentColor"/></svg>`}

function header(){
 let s='';
 if(admin)s=`<div class="session"><span class="sesstxt" title="${esc(admin.email||'')}">${esc(admin.email||'مدير النظام')}</span> <button onclick="adminLogout()">خروج</button></div>`;
 else if(member)s=`<div class="session">${esc(member.full_name)} <button onclick="memberLogout()">خروج</button></div>`;
 return `<div class="mast"><div class="brand"><div class="mark">${logo(44)}</div><div><h1>منظومة الانتساب الإلكترونية</h1><p>${ORG} — ${PLACE}</p></div></div>${s}</div>`;
}
function shell(b){app.innerHTML=header()+b}
function msgBox(){return message?`<div class="msg ${messageType==='ok'?'ok':'err'}">${esc(message)}</div>`:''}
function heroBlock(title,sub){return `<div class="herologin"><div class="mark2">${logo(100)}</div><h2>${title}</h2><div class="divider"><span></span>◆<span></span></div><div class="sub">${sub}</div></div>`}

/* ---------- تثبيت التطبيق ---------- */
let deferredPrompt=null;
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(view==='home')render()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;if(view==='home')render()});
function installBlock(){
 if(isStandalone())return '';
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 let inner;
 if(deferredPrompt)inner=`<button class="btn" style="width:100%" onclick="doInstall()">تثبيت التطبيق على هاتفك</button>`;
 else if(ios)inner=`<div class="hint">اضغط زر المشاركة في متصفح Safari ثم اختر <b>إضافة إلى الشاشة الرئيسية</b>.</div>`;
 else inner=`<div class="hint">افتح قائمة المتصفح (⋮) ثم اختر <b>تثبيت التطبيق</b> أو <b>إضافة إلى الشاشة الرئيسية</b>.</div>`;
 return `<div class="card" style="margin-top:12px;text-align:center"><b>ثبّت التطبيق على هاتفك</b><div style="margin-top:10px">${inner}</div></div>`;
}
async function doInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;render()}

/* زر الرجوع في الهاتف يتنقل داخل التطبيق بدل الخروج منه */
function navSync(){
 if(window._navView===view)return;
 if(window._navInit)history.pushState({v:view},'');else history.replaceState({v:view},'');
 window._navView=view;window._navInit=true;
}
window.addEventListener('popstate',e=>{
 let v=(e.state&&e.state.v)||'home';
 const need={profile:!member,edit:!member,success:!member,dashboard:!admin};
 if(need[v])v='home';
 view=v;window._navView=v;render();
});

function home(){
 shell(`${heroBlock('انتسب إلى '+ORG,PLACE+' — سجّل بياناتك في دقيقتين')}
 <div class="grid3">

 </div>${installBlock()}`);
}
function go(v){view=v;setMsg('');render()}

/* ---------- الصور ---------- */
function compress(file,max,q){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>rej(new Error('img'));img.src=u})}
async function onFile(inp,kind){
 const f=inp.files[0];if(!f)return;
 try{const d=await compress(f,kind==='photo'?480:1100,kind==='photo'?.82:.72);
  draft[kind==='photo'?'photo':'idPhoto']=d;
  const p=document.getElementById('pv_'+kind);p.src=d;p.style.display='block';
 }catch(e){alert('تعذر قراءة الصورة، جرّب صورة أخرى.')}
}
function toggleSkill(el,s){const i=draft.skills.indexOf(s);if(i>=0)draft.skills.splice(i,1);else draft.skills.push(s);el.classList.toggle('on')}

/* ---------- نموذج التسجيل / التعديل (خطوات) ---------- */
const QUALS=['ثانوية عامة','دبلوم متوسط','دبلوم عالي','بكالوريوس / ليسانس','ماجستير','دكتوراه','أخرى'];
const STEPS=['البيانات الشخصية','الهوية والتواصل','التعليم','الخبرات والمهارات'];
let curStep=1,yn={vol:false,crs:false,lang:false};

function listInputs(prefix,arr,ph){return [0,1,2].map(i=>`<div class="lrow"><span class="lnum">${i+1}.</span><input id="${prefix}${i}" placeholder="${ph}" value="${esc(arr[i]||'')}"></div>`).join('')}
function ynField(key,label,detailHtml,on){
 return `<div class="field"><label>${label}</label><div class="yn"><button type="button" id="yn_${key}_1" class="${on?'on':''}" onclick="setYn('${key}',true)">نعم</button><button type="button" id="yn_${key}_0" class="${on?'':'on'}" onclick="setYn('${key}',false)">لا</button></div><div id="det_${key}" style="display:${on?'block':'none'}">${detailHtml}</div></div>`;
}
function setYn(k,v){yn[k]=v;document.getElementById('yn_'+k+'_1').classList.toggle('on',v);document.getElementById('yn_'+k+'_0').classList.toggle('on',!v);document.getElementById('det_'+k).style.display=v?'block':'none'}

function memberForm(m,edit){
 window._edit=edit;
 draft={photo:null,idPhoto:null,skills:[...(m?.skills||[])]};
 curStep=1;
 yn={vol:(m?.volunteer_work||[]).length>0,crs:(m?.courses||[]).length>0,lang:!!(m?.languages)};
 const v=k=>esc(m?.[k]||'');
 const chips=SKILLS.map(s=>`<span class="chip ${draft.skills.includes(s)?'on':''}" onclick="toggleSkill(this,'${s}')">${s}</span>`).join('');
 const quals='<option value="">اختر</option>'+QUALS.map(q=>`<option ${m?.qualification===q?'selected':''}>${q}</option>`).join('');
 const oldPhoto=edit&&safeImg(m.photo)?`<img class="pv" id="pv_photo" style="display:block" src="${safeImg(m.photo)}">`:`<img class="pv" id="pv_photo">`;
 return `<div class="progress">${STEPS.map((s,i)=>`<div class="pstep" data-step="${i+1}">${i+1}. ${s}</div>`).join('')}</div>
 <form onsubmit="saveMember(event,${edit})">
 <div class="step" data-step="1"><div class="stephead">البيانات الشخصية</div>
  <div class="field"><label>الصورة الشخصية ${edit?'':'*'}</label><input type="file" accept="image/*" onchange="onFile(this,'photo')">${oldPhoto}${edit?'<div class="hint">ارفع صورة جديدة فقط إن أردت استبدالها</div>':''}</div>
  <div class="field"><label>الاسم الرباعي *</label><input id="f_name" value="${v('full_name')}"></div>
  <div class="row2"><div class="field"><label>تاريخ الميلاد *</label><input id="f_dob" type="date" value="${v('dob')}" onchange="ageHint()"><div id="agehint" class="hint">${m?.dob?'العمر: '+ageOf(m.dob)+' سنة':''}</div></div>
  <div class="field"><label>مكان الميلاد</label><input id="f_birthplace" value="${v('birth_place')}"></div></div>
  <div class="row2"><div class="field"><label>البلدية المقيم بها</label><input id="f_muni" value="${v('municipality')}"></div>
  <div class="field"><label>عنوان السكن</label><input id="f_addr" value="${v('address')}"></div></div>
 </div>
 <div class="step" data-step="2"><div class="stephead">الهوية والتواصل</div>
  <div class="row2"><div class="field"><label>الرقم الوطني *</label><input id="f_nid" inputmode="numeric" maxlength="12" ${edit?'disabled':''} value="${v('national_id')}"><div class="hint">${edit?'لا يمكن تغيير الرقم الوطني':'12 رقمًا'}</div></div>
  <div class="field"><label>رقم البطاقة الشخصية</label><input id="f_idcard" value="${v('id_card_no')}"></div></div>
  <div class="field"><label>رقم جواز السفر</label><input id="f_passport" value="${v('passport_no')}"></div>
  <div class="row2"><div class="field"><label>رقم الهاتف *</label><input id="f_phone" type="tel" inputmode="numeric" placeholder="09xxxxxxxx" value="${v('phone')}"></div>
  <div class="field"><label>رقم الواتساب</label><input id="f_wa" type="tel" inputmode="numeric" placeholder="فارغ = نفس رقم الهاتف" value="${esc(m&&m.whatsapp!==m.phone?m.whatsapp||'':'')}"></div></div>
  <div class="field"><label>البريد الإلكتروني</label><input id="f_email" type="email" autocapitalize="none" value="${v('email')}"></div>
  ${edit?'':`<div class="row2"><div class="field"><label>كلمة المرور (الرقم السري) *</label><input id="f_pass" type="password" autocomplete="new-password" placeholder="6 خانات على الأقل"></div><div class="field"><label>تأكيد كلمة المرور *</label><input id="f_pass2" type="password" autocomplete="new-password" placeholder="أعد كتابتها"></div></div><div class="hint" style="margin:-6px 0 14px">ستدخل بها لاحقًا لتعديل بياناتك أو عرض بطاقتك، فاحتفظ بها.</div>`}
  <div class="field"><label>صورة إثبات الهوية ${edit?'':'*'}</label><input type="file" accept="image/*" onchange="onFile(this,'idPhoto')"><img class="pv pvid" id="pv_idPhoto"><div class="hint">${edit?'لأسباب أمنية لا تُعرض الصورة المحفوظة؛ ارفع صورة جديدة فقط لاستبدالها':'بطاقة شخصية / جواز سفر / إقامة'}</div></div>
 </div>
 <div class="step" data-step="3"><div class="stephead">التعليم</div>
  <div class="field"><label>المؤهل العلمي</label><select id="f_qual">${quals}</select></div>
  <div class="field"><label>اسم المؤسسة التعليمية</label><input id="f_inst" value="${v('institution')}"></div>
 </div>
 <div class="step" data-step="4"><div class="stephead">الخبرات والمهارات</div>
  ${ynField('vol','هل قمت بأي أعمال تطوعية؟',listInputs('v',m?.volunteer_work||[],'اكتب العمل التطوعي'),yn.vol)}
  ${ynField('crs','هل حصلت على دورات تدريبية؟',listInputs('c',m?.courses||[],'اكتب اسم الدورة'),yn.crs)}
  ${ynField('lang','هل تجيد لغات أخرى؟',`<input id="f_lang" placeholder="اذكرها" value="${v('languages')}">`,yn.lang)}
  <div class="field"><label>المهارات</label><div class="chips">${chips}</div><input id="f_other" placeholder="مهارات أخرى (نص حر)" value="${v('skills_other')}"></div>
  <div class="field"><label>ملاحظات</label><textarea id="f_notes">${v('notes')}</textarea></div>
 </div>
 <div class="btnrow"><button class="btn outline" type="button" id="btnPrev" onclick="prevStep()">→ السابق</button><button class="btn" type="button" id="btnNext" onclick="nextStep()">التالي ←</button><button class="btn" type="submit" id="btnSave">${edit?'حفظ التعديلات':'إتمام الانتساب'}</button><button class="btn outline" type="button" onclick="${edit?"go('profile')":"go('home')"}">إلغاء</button></div></form>`;
}
function showStep(n){
 curStep=n;
 document.querySelectorAll('.step').forEach(s=>s.style.display=+s.dataset.step===n?'block':'none');
 document.querySelectorAll('.pstep').forEach(p=>{const i=+p.dataset.step;p.classList.toggle('cur',i===n);p.classList.toggle('done',i<n)});
 document.getElementById('btnPrev').style.visibility=n>1?'visible':'hidden';
 document.getElementById('btnNext').style.display=n<STEPS.length?'inline-block':'none';
 document.getElementById('btnSave').style.display=n===STEPS.length?'inline-block':'none';
 document.querySelector('.panel .msg')?.remove();
 window.scrollTo({top:0,behavior:'smooth'});
}
function nextStep(){const e=validateStep(curStep);if(e)return formError(e);showStep(curStep+1)}
function prevStep(){showStep(curStep-1)}
function gv(id){return document.getElementById(id).value.trim()}
function validateStep(n){
 const edit=window._edit;
 if(n===1){
  if(gv('f_name').split(/\s+/).filter(Boolean).length<3)return 'اكتب الاسم الرباعي كاملًا.';
  const a=ageOf(gv('f_dob'));if(a==null||a<10||a>90)return 'تاريخ الميلاد غير صحيح.';
  if(!edit&&!draft.photo)return 'الصورة الشخصية مطلوبة.';
 }
 if(n===2){
  if(!edit&&!/^\d{12}$/.test(normalizeDigits(gv('f_nid'))))return 'الرقم الوطني يجب أن يتكون من 12 رقمًا.';
  if(!/^09\d{8}$/.test(normalizeDigits(gv('f_phone'))))return 'رقم الهاتف يجب أن يكون 10 أرقام ويبدأ بـ 09.';
  const wa=normalizeDigits(gv('f_wa'));if(wa&&!/^\d{9,15}$/.test(wa))return 'رقم الواتساب غير صحيح.';
  const em=gv('f_email');if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return 'البريد الإلكتروني غير صحيح.';
  if(!edit){
   const p1=document.getElementById('f_pass').value,p2=document.getElementById('f_pass2').value;
   if(p1.length<6)return 'كلمة المرور يجب ألا تقل عن 6 خانات.';
   if(p1!==p2)return 'كلمتا المرور غير متطابقتين.';
  }
  if(!edit&&!draft.idPhoto)return 'صورة إثبات الهوية مطلوبة.';
 }
 if(n===4){
  if(yn.vol&&![0,1,2].some(i=>gv('v'+i)))return 'اكتب عملًا تطوعيًا واحدًا على الأقل أو اختر "لا".';
  if(yn.crs&&![0,1,2].some(i=>gv('c'+i)))return 'اكتب دورة واحدة على الأقل أو اختر "لا".';
  if(yn.lang&&!gv('f_lang'))return 'اذكر اللغات التي تجيدها أو اختر "لا".';
 }
 return '';
}
function ageHint(){const a=ageOf(document.getElementById('f_dob').value);document.getElementById('agehint').textContent=a==null?'':`العمر: ${a} سنة`}
function goRegister(){setMsg('');view='register';render()}
function registerPage(){shell(`<div class="back" onclick="go('home')">← الرئيسية</div><div class="panel"><h3>استمارة الانتساب</h3>${msgBox()}${memberForm(null,false)}</div>`);showStep(1)}
function editPage(){shell(`<div class="back" onclick="go('profile')">← ملفي</div><div class="panel"><h3>تعديل بياناتي</h3>${msgBox()}${memberForm(member,true)}</div>`);showStep(1)}

function formError(t){setMsg(t);const p=document.querySelector('.panel');let b=p.querySelector('.msg');if(!b){b=document.createElement('div');p.querySelector('h3').after(b)}b.className='msg err';b.textContent=t;b.scrollIntoView({behavior:'smooth',block:'center'})}

async function saveMember(e,edit){
 e.preventDefault();
 if(curStep<STEPS.length)return nextStep();
 for(const s of [1,2,3,4]){const er=validateStep(s);if(er){showStep(s);return formError(er)}}
 const name=gv('f_name'),dob=gv('f_dob'),phone=normalizeDigits(gv('f_phone')),wa=normalizeDigits(gv('f_wa'))||phone;
 const nid=edit?member.national_id:normalizeDigits(gv('f_nid'));
 const a=ageOf(dob);
 const pass=edit?'':document.getElementById('f_pass').value;
 const vol=yn.vol?[0,1,2].map(i=>gv('v'+i)).filter(Boolean):[];
 const crs=yn.crs?[0,1,2].map(i=>gv('c'+i)).filter(Boolean):[];
 const common={full_name:name,dob,age:a,phone,whatsapp:wa,birth_place:gv('f_birthplace'),municipality:gv('f_muni'),address:gv('f_addr'),
  id_card_no:gv('f_idcard'),passport_no:gv('f_passport'),email:gv('f_email'),qualification:gv('f_qual'),institution:gv('f_inst'),
  volunteer_work:vol,courses:crs,languages:yn.lang?gv('f_lang'):'',skills:draft.skills,skills_other:gv('f_other'),notes:gv('f_notes')};
 const btn=document.getElementById('btnSave');btn.disabled=true;btn.textContent='جاري الحفظ...';
 try{
  if(!edit){
   const {error}=await sb.from('volunteer_members').insert({...common,national_id:nid,photo:draft.photo,id_photo:draft.idPhoto,new_password:pass});
   if(error)throw error;
  }else{
   const upd={...common};
   if(draft.photo)upd.photo=draft.photo;
   if(draft.idPhoto)upd.id_photo=draft.idPhoto;
   const {error}=await sb.rpc('member_update',{p_id:member.id,p_ident:member.national_id,p_password:memberPass,p_data:upd});
   if(error)throw error;
  }
  const {data}=await sb.rpc('member_login',{p_ident:nid,p_password:edit?memberPass:pass});
  if(!data)throw new Error('login_failed');
  member=data;if(!edit)memberPass=pass;
  if(edit){setMsg('تم حفظ التعديلات بنجاح.','ok');view='profile'}else{view='success'}
  render();
 }catch(err){
  console.error(err);btn.disabled=false;btn.textContent=edit?'حفظ التعديلات':'إتمام الانتساب';
  let t='تعذر حفظ البيانات.';
  if(err?.code==='23505')t='الرقم الوطني أو رقم الهاتف مسجّل مسبقًا. إن كنت مسجّلًا فادخل من "دخول المنتسب".';
  else if(err?.code==='23514')t='حجم إحدى الصور كبير جدًا، جرّب صورة أخرى.';
  else if(String(err?.message).includes('password_required'))t='كلمة المرور يجب ألا تقل عن 6 خانات.';
  else if(err?.code==='42703'||err?.code==='PGRST204'||err?.code==='PGRST202')t='قاعدة البيانات تحتاج ترقية. شغّل ملفات الترقية SQL في Supabase.';
  else if(err?.code==='42501'||err?.status===401||err?.status===403)t='رُفض الحفظ بسبب صلاحيات قاعدة البيانات. شغّل ملف الإعداد SQL.';
  else if(String(err?.message).includes('not_found'))t='تعذر العثور على سجلك.';
  else if(err?.message)t+=' '+err.message;
  formError(t);
 }
}

/* ---------- صفحة النجاح (تنبيه التسجيل) ---------- */
function successPage(){
 const m=member,txt=`مرحبًا ${m.full_name}، تم انتسابك بنجاح إلى ${ORG} - ${PLACE}.\nرقم العضوية: ${m.member_no}\nرابط بياناتك: ${verifyUrl(m.id)}`;
 const wa=`https://wa.me/${waNumber(m.whatsapp||m.phone)}?text=${encodeURIComponent(txt)}`;
 shell(`<div class="herologin">${`<div class="markico" style="color:var(--ok)"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>`}<h2>تم انتسابك بنجاح</h2><div class="sub">أهلًا بك ${esc(m.full_name)} — رقم العضوية <b>${m.member_no}</b></div></div>
 <div class="panel herologin" style="margin-top:0"><div class="msg ok">تم قبول انتسابك تلقائيًا. احتفظ برقمك الوطني أو هاتفك مع كلمة المرور للدخول وتعديل بياناتك لاحقًا.</div>
 <div class="btnrow" style="flex-direction:column"><button class="btn" onclick="previewCard(member)">معاينة بطاقة المنتسب PDF</button><a class="btn outline" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${wa}">إرسال ملخص بياناتي على واتساب</a><button class="btn outline" onclick="go('profile')">ملفي الشخصي</button></div></div>`);
}

/* ---------- دخول المنتسب ---------- */
function memberLoginPage(){
 shell(`<div class="back" onclick="go('home')">← الرئيسية</div>${heroBlock('دخول المنتسب','أدخل رقمك الوطني أو هاتفك وكلمة المرور')}
 <div class="panel herologin" style="margin-top:0">${msgBox()}<form onsubmit="memberDoLogin(event)"><div class="field"><label>الرقم الوطني أو رقم الهاتف</label><input id="ident" inputmode="numeric" value="${esc(window._prefillIdent||'')}" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input id="mpass" type="password" autocomplete="current-password" required></div><button class="btn" style="width:100%">دخول ←</button></form><div style="text-align:center;margin-top:16px"><a class="flink" onclick="forgotStart()">نسيت كلمة المرور؟</a></div></div>`);
}
let fp={stage:'phone',phone:'',exists:null,code:'',msg:'',ok:false,cool:0},fpT;
const fpD=s=>normalizeDigits(String(s||'')).replace(/\D/g,'');
function forgotStart(){fp={stage:'phone',phone:'',exists:null,code:'',msg:'',ok:false,cool:0};setMsg('');view='forgot';render()}
function fpMsg(m,ok){fp.msg=m;fp.ok=!!ok;const b=document.getElementById('fpm');if(b){b.className='msg '+(ok?'ok':'err');b.textContent=m;b.style.display=m?'block':'none'}}
function fpUpd(){
 const a=document.getElementById('fpAct');if(!a)return;
 a.innerHTML=fp.phone.length<9?'':fp.exists===null?'<div class="hint">جارِ التحقق من الرقم...</div>':fp.exists==='err'?'<div class="msg err">تعذر التحقق من الرقم، حاول لاحقًا.</div>':fp.exists?'<button type="button" class="btn" style="width:100%" onclick="fpConfirmAcc()">✓ تأكيد الحساب</button>':'<div class="msg err">هذا الرقم غير مسجَّل في المنظومة.</div>';
}
function fpPhone(el){
 fp.phone=fpD(el.value);fp.exists=null;fpUpd();clearTimeout(fpT);
 if(fp.phone.length<9)return;
 fpT=setTimeout(async()=>{const ph=fp.phone;const {data,error}=await sb.rpc('member_reset_check_phone',{p_phone:ph});if(ph!==fp.phone)return;fp.exists=error?'err':!!data;fpUpd()},450);
}
function fpConfirmAcc(){fp.stage='code';fp.msg='';render()}
async function fpSend(){
 if(fp.cool>0)return;
 const b=document.getElementById('fpSend');if(b)b.disabled=true;
 fpMsg('جارِ إرسال الكود...',true);
 const {data,error}=await sb.rpc('member_reset_send_code',{p_phone:fp.phone});
 if(error||!data||!data.ok){
  if(error&&(error.code==='PGRST202'||error.code==='42883')){fpMsg('قاعدة البيانات تحتاج ترقية. شغّل ملف volunteer-upgrade4.sql في Supabase.');if(b)b.disabled=false;return}
  const e=data&&data.error;
  fpMsg(e==='wait'?'انتظر دقيقة قبل طلب كود جديد.':e==='limit'?'وصلت الحد الأقصى لطلب الكود هذه الساعة. حاول لاحقًا أو تواصل مع الإدارة.':e==='sms_not_configured'?'خدمة الرسائل غير مفعّلة بعد، تواصل مع الإدارة.':e==='not_found'?'هذا الرقم غير مسجَّل في المنظومة.':'تعذر إرسال الكود، حاول مرة أخرى.');
  if(b)b.disabled=false;return;
 }
 fpMsg('تم إرسال كود من 4 أرقام إلى رقم هاتفك.',true);
 fp.cool=60;
 const t=setInterval(()=>{fp.cool--;const x=document.getElementById('fpSend');if(!x||fp.stage!=='code'){clearInterval(t);return}
  if(fp.cool>0)x.textContent='إعادة الإرسال بعد '+fp.cool+'ث';else{clearInterval(t);x.textContent='إعادة إرسال الكود';x.disabled=false}},1000);
}
async function fpVerify(){
 const c=fpD(document.getElementById('fpCode').value);
 if(c.length!==4){fpMsg('اكتب الكود المكوّن من 4 أرقام.');return}
 const {data,error}=await sb.rpc('member_reset_verify_code',{p_phone:fp.phone,p_code:c});
 if(error||!data){fpMsg('الكود غير صحيح أو منتهي الصلاحية.');return}
 fp.code=c;fp.stage='pass';fp.msg='';render();
}
async function fpSave(e){
 e.preventDefault();
 const p1=document.getElementById('fpP1').value,p2=document.getElementById('fpP2').value;
 if(p1.length<6){fpMsg('كلمة المرور يجب أن تكون 6 أحرف على الأقل.');return}
 if(p1!==p2){fpMsg('كلمتا المرور غير متطابقتين.');return}
 const {data,error}=await sb.rpc('member_reset_set_password',{p_phone:fp.phone,p_code:fp.code,p_new:p1});
 if(error||!data){fpMsg('تعذر تغيير كلمة المرور، أعد المحاولة من البداية.');return}
 fp.stage='done';fp.msg='';render();
}
function forgotPage(){
 const st=fp.stage||'phone',M=`<div id="fpm" class="msg ${fp.ok?'ok':'err'}" style="display:${fp.msg?'block':'none'}">${esc(fp.msg)}</div>`;
 let head,body;
 if(st==='phone'){head='اكتب رقم الهاتف الذي سجّلت به';body=`${M}<div class="field"><label>رقم الهاتف</label><input type="tel" inputmode="tel" placeholder="09xxxxxxxx" value="${esc(fp.phone)}" oninput="fpPhone(this)"></div><div id="fpAct"></div>`}
 else if(st==='code'){head='اضغط «إرسال الكود» لتصلك رسالة على رقم هاتفك';body=`${M}<div class="field"><label>رقم الهاتف</label><input value="${esc(fp.phone)}" disabled></div><div class="field"><label>الكود (4 أرقام)</label><input id="fpCode" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="one-time-code" style="letter-spacing:6px;font-weight:800;text-align:center"></div><div class="btnrow"><button type="button" id="fpSend" class="btn outline" onclick="fpSend()">إرسال الكود</button><button type="button" class="btn" onclick="fpVerify()">تأكيد</button></div>`}
 else if(st==='pass'){head='اختر كلمة مرور جديدة لحسابك';body=`<form onsubmit="fpSave(event)">${M}<div class="field"><label>كلمة المرور الجديدة</label><input id="fpP1" type="password" minlength="6" autocomplete="new-password" placeholder="6 أحرف على الأقل" required></div><div class="field"><label>تأكيد كلمة المرور</label><input id="fpP2" type="password" minlength="6" autocomplete="new-password" required></div><button class="btn" style="width:100%">حفظ كلمة المرور</button></form>`}
 else{head='تم تغيير كلمة المرور';body=`<div class="msg ok">يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.</div><button class="btn" style="width:100%" onclick="window._prefillIdent=fp.phone;go('memberLogin')">العودة لتسجيل الدخول ←</button>`}
 const foot=(st==='phone'||st==='code')?'<div class="hint" style="margin-top:12px">إن تغيّر رقم هاتفك أو لم يصلك الكود، تواصل مع إدارة الوكالة لتعيين كلمة مرور جديدة لك.</div>':'';
 shell(`<div class="back" onclick="go('memberLogin')">← رجوع</div>${heroBlock('نسيت كلمة المرور',head)}<div class="panel herologin" style="margin-top:0">${body}${foot}</div>`);
}
async function memberDoLogin(e){
 e.preventDefault();
 const v=normalizeDigits(document.getElementById('ident').value.trim()),p=document.getElementById('mpass').value;
 if(!/^\d{10}$|^\d{12}$/.test(v)){setMsg('أدخل رقمًا وطنيًا من 12 رقمًا أو هاتفًا من 10 أرقام.');return render()}
 const {data,error}=await sb.rpc('member_login',{p_ident:v,p_password:p});
 if(error||!data){setMsg('بيانات الدخول غير صحيحة.');return render()}
 member=data;memberPass=p;view='profile';setMsg('');render();
}
function memberLogout(){member=null;memberPass='';go('home')}
function profilePage(){
 const m=member;
 shell(`<div class="back" onclick="memberLogout()">← خروج</div><div class="panel"><h3>ملفي الشخصي</h3>${msgBox()}
 <div class="dhead">${safeImg(m.photo)?`<img src="${safeImg(m.photo)}">`:''}<div><b style="font-size:17px">${esc(m.full_name)}</b><div class="hint">رقم العضوية ${m.member_no}</div><span class="badge ${m.status==='active'?'b-on':'b-off'}">${m.status==='active'?'نشط':'غير نشط'}</span></div></div>
 ${rowsTable(m)}
 <div class="btnrow"><button class="btn" onclick="previewCard(member)">معاينة بطاقة المنتسب PDF</button><button class="btn outline" onclick="go('edit')">تعديل بياناتي</button></div></div>`);
}
function rowsTable(m){
 const list=a=>(a&&a.length)?a.map((x,i)=>`${i+1}. ${x}`).join(' — '):'لا';
 const rows=[['الاسم الرباعي',m.full_name],['تاريخ الميلاد',`${m.dob} (${ageOf(m.dob)} سنة)`],['مكان الميلاد',m.birth_place||'—'],['البلدية المقيم بها',m.municipality||'—'],['عنوان السكن',m.address||'—'],['الرقم الوطني',m.national_id],['رقم البطاقة الشخصية',m.id_card_no||'—'],['رقم جواز السفر',m.passport_no||'—'],['رقم الهاتف',m.phone],['واتساب',m.whatsapp||m.phone],['البريد الإلكتروني',m.email||'—'],['المؤهل العلمي',m.qualification||'—'],['المؤسسة التعليمية',m.institution||'—'],['أعمال تطوعية',list(m.volunteer_work)],['دورات تدريبية',list(m.courses)],['لغات أخرى',m.languages||'لا'],['المهارات',skillsText(m)],['ملاحظات',m.notes||'—'],['تاريخ الانتساب',fmtDate(m.created_at)]];
 return `<table class="ntable"><tbody>${rows.map(([l,v])=>`<tr><td class="lbl">${l}</td><td>${esc(v)}</td></tr>`).join('')}</tbody></table>`;
}

/* ---------- بطاقة المنتسب + QR + PDF ---------- */
function qrDataUrl(text){
 const d=document.createElement('div');d.style.cssText='position:fixed;left:-9999px';document.body.appendChild(d);
 new QRCode(d,{text,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
 const c=d.querySelector('canvas'),u=c?c.toDataURL('image/png'):'';
 d.remove();return u;
}
function cardHtml(m){
 const rows=[['رقم العضوية',m.member_no],['الاسم الرباعي',m.full_name],['الرقم الوطني',m.national_id],['تاريخ الميلاد',`${m.dob} (${ageOf(m.dob)} سنة)`],['مكان الميلاد',m.birth_place||'—'],['البلدية',m.municipality||'—'],['رقم الهاتف',m.phone],['واتساب',m.whatsapp||m.phone],['المؤهل العلمي',m.qualification||'—'],['المهارات',skillsText(m)],['الحالة',m.status==='active'?'نشط':'غير نشط'],['تاريخ الانتساب',fmtDate(m.created_at)]];
 return `<div class="psheet"><div class="phead"><div><h1>${ORG}</h1><p>${PLACE} — بطاقة منتسب</p></div><img class="plogo" src="${LOGO}"></div>
 <div class="pbody">${safeImg(m.photo)?`<img class="pphoto" src="${safeImg(m.photo)}">`:'<div class="pphoto"></div>'}
 <table class="pinfo"><tbody>${rows.map(([l,v])=>`<tr><td class="lbl">${l}</td><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div>
 <div class="pqr"><img src="${qrDataUrl(verifyUrl(m.id))}"><div>امسح الرمز للتحقق من صحة الانتساب ميدانيًا.</div></div>
 <div class="pfoot"><span>${ORG} — ${PLACE}</span><span>تاريخ الإصدار: ${new Date().toLocaleDateString('ar-EG')}</span></div></div>`;
}
function previewCard(m){
 const z=Math.min(1,(window.innerWidth-60)/750);
 const bg=document.createElement('div');bg.className='modalbg';bg.id='cardBg';
 bg.innerHTML=`<div class="modal" style="width:min(780px,100%)"><div style="zoom:${z}">${cardHtml(m)}</div>
 <div class="btnrow"><button class="btn" onclick="saveCardPdf('${m.id}')">حفظ ملف PDF</button><button class="btn outline" onclick="document.getElementById('cardBg').remove()">إغلاق</button></div></div>`;
 document.body.appendChild(bg);
 window._cardMember=m;
}
async function htmlToPdfPages(pages,filename){
 if(!window.html2canvas||!window.jspdf){alert('تعذر تحميل مكتبة إنشاء PDF. تأكد من اتصال الإنترنت.');return}
 const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:'a4'});
 const stage=document.createElement('div');stage.style.cssText='position:fixed;left:-99999px;top:0;background:#fff;direction:rtl';document.body.appendChild(stage);
 for(let i=0;i<pages.length;i++){
  stage.innerHTML=pages[i];await new Promise(r=>setTimeout(r,80));
  const canvas=await html2canvas(stage,{scale:2,useCORS:true,backgroundColor:'#ffffff'});
  const pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight();
  let w=pw-40,h=canvas.height*w/canvas.width;if(h>ph-40){h=ph-40;w=canvas.width*h/canvas.height}
  if(i>0)doc.addPage();
  doc.addImage(canvas.toDataURL('image/jpeg',.92),'JPEG',(pw-w)/2,20,w,h);
 }
 stage.remove();doc.save(filename);
}
async function saveCardPdf(){const m=window._cardMember;await htmlToPdfPages([cardHtml(m)],`card_${m.member_no}.pdf`)}

/* ---------- التحقق عبر QR ---------- */
async function verifyPage(id){
 shell('<div class="empty">جارِ التحقق...</div>');
 let d=null;
 if(/^[0-9a-f-]{36}$/i.test(id)){const r=await sb.rpc('member_verify',{p_id:id});d=r.data}
 const ok=d&&d.status==='active';
 shell(`<div class="herologin"><div class="markico" style="color:${ok?'var(--ok)':'var(--danger)'}"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${ok?'<path d="M5 12.5l4.5 4.5L19 7.5"/>':'<path d="M6 6l12 12M18 6L6 18"/>'}</svg></div>
 <h2>${!d?'انتساب غير صحيح':ok?'منتسب نشط':'منتسب غير نشط'}</h2>
 ${d?`<div class="panel"><div style="font-size:18px;font-weight:800">${esc(d.full_name)}</div><div class="hint">رقم العضوية ${d.member_no}</div><p>${ORG} — ${PLACE}</p></div>`:'<div class="sub">لم يُعثر على سجل مطابق لهذا الرمز.</div>'}</div>`);
}

/* ---------- الإدارة ---------- */
function adminLoginPage(){
 shell(`<div class="back" onclick="go('home')">← الرئيسية</div>${heroBlock('دخول الإدارة','سجّل الدخول بحساب المدير')}
 <div class="panel herologin" style="margin-top:0">${msgBox()}<form onsubmit="adminDoLogin(event)"><div class="field"><label>البريد الإلكتروني</label><input id="au" type="email" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input id="ap" type="password" autocomplete="current-password" required></div><button class="btn" style="width:100%">دخول ←</button></form></div>`);
}
async function adminDoLogin(e){
 e.preventDefault();
 const email=document.getElementById('au').value.trim().toLowerCase(),pw=document.getElementById('ap').value;
 const btn=e.target.querySelector('button');btn.disabled=true;btn.textContent='جاري الدخول...';
 let r;try{r=await sb.auth.signInWithPassword({email,password:pw})}catch(x){r={error:x}}
 const {data,error}=r;
 if(error){
  const m=String(error.message||'');
  let t='تعذر تسجيل الدخول: '+m;
  if(/invalid login credentials/i.test(m))t='البريد أو كلمة المرور غير صحيحة، أو أن هذا الحساب غير موجود في المشروع.';
  else if(/email not confirmed/i.test(m))t='الحساب غير مؤكَّد. في Supabase افتح Authentication ثم Users، واختر الحساب ثم Confirm user.';
  else if(/failed to fetch|network|load failed/i.test(m))t='تعذر الاتصال بقاعدة البيانات. تأكد من الإنترنت.';
  setMsg(t);return render();
 }
 admin=data.user;await loadRecords();view='dashboard';setMsg('');render();
}
async function adminLogout(){await sb.auth.signOut();admin=null;records=[];go('home')}
async function loadRecords(){
 const {data,error}=await sb.from('volunteer_members').select(COLS).order('created_at',{ascending:false});
 if(error){setMsg('تعذر قراءة البيانات. تأكد من تشغيل ملف SQL وإنشاء حساب المدير.');records=[];return}
 records=data||[];
}
function filtered(){
 const q=normalizeDigits(fSearch.trim());
 return records.filter(r=>(!fSkill||(r.skills||[]).includes(fSkill)||(fSkill==='__other'&&r.skills_other))
  &&(!fStatus||r.status===fStatus)
  &&(!q||[r.full_name,r.national_id,r.phone,r.municipality,r.email,r.qualification,skillsText(r)].some(x=>(x||'').includes(q))));
}
function dashboard(){
 if(!admin){go('home');return}
 const on=records.filter(r=>r.status==='active').length;
 shell(`<div class="eyebrow">لوحة الإدارة</div><h2>المنتسبون</h2>${msgBox()}
 <div class="stats"><div class="stat"><b>${records.length}</b><span>الإجمالي</span></div><div class="stat"><b>${on}</b><span>نشط</span></div><div class="stat"><b>${records.length-on}</b><span>غير نشط</span></div><div class="stat"><b id="sshown">—</b><span>المعروض حاليًا</span></div></div>
 <div class="toolbar"><input class="search" placeholder="بحث بالاسم أو المهارة أو الرقم الوطني أو الهاتف..." value="${esc(fSearch)}" oninput="fSearch=this.value;drawTable()">
 <select onchange="fSkill=this.value;drawTable()"><option value="">كل المهارات</option>${SKILLS.map(s=>`<option ${fSkill===s?'selected':''}>${s}</option>`).join('')}</select>
 <select onchange="fStatus=this.value;drawTable()"><option value="">كل الحالات</option><option value="active" ${fStatus==='active'?'selected':''}>نشط</option><option value="inactive" ${fStatus==='inactive'?'selected':''}>غير نشط</option></select></div>
 <div class="toolbar"><button class="btn outline small" onclick="exportPdfAll()">تصدير بطاقات PDF للمعروضين</button><button class="btn outline small" onclick="exportCSV()">تصدير CSV</button><button class="btn outline small" onclick="loadRecords().then(render)">تحديث</button></div>
 <div class="tablewrap"><table><thead><tr><th>#</th><th>الاسم</th><th>الهاتف</th><th>المهارات</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="tb"></tbody></table></div>`);
 drawTable();
}
function drawTable(){
 const m=filtered();document.getElementById('sshown').textContent=m.length;
 document.getElementById('tb').innerHTML=m.length?m.map(r=>`<tr><td>${r.member_no}</td><td><a href="javascript:void(0)" onclick="showDetail('${r.id}')" style="color:var(--olive);font-weight:800;text-decoration:underline">${esc(r.full_name)}</a></td><td>${esc(r.phone)}</td><td>${esc(skillsText(r))}</td>
 <td><span class="badge ${r.status==='active'?'b-on':'b-off'}">${r.status==='active'?'نشط':'غير نشط'}</span></td>
 <td><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="btn outline small" onclick="showDetail('${r.id}')">عرض</button><button class="btn outline small" onclick="toggleStatus('${r.id}')">${r.status==='active'?'تعليق':'تفعيل'}</button><button class="btn outline small" onclick="adminResetPass('${r.id}')">كلمة مرور</button><button class="btn danger small" onclick="del('${r.id}')">حذف</button></div></td></tr>`).join(''):`<tr><td colspan="6" class="empty">${records.length?'لا توجد بيانات.':'لا توجد بيانات ظاهرة. إن كان هناك منتسبون فتأكد أن البريد الظاهر أعلى الشاشة هو نفس بريد الإدارة المحدد في سياسة قاعدة البيانات.'}</td></tr>`;
}
async function getFull(id){
 const r=records.find(x=>x.id===id);if(!r)return null;
 if(r.photo===undefined){const {data}=await sb.from('volunteer_members').select('photo,id_photo').eq('id',id).single();Object.assign(r,data||{photo:null,id_photo:null})}
 return r;
}
async function showDetail(id){
 const r=await getFull(id);if(!r)return;
 const bg=document.createElement('div');bg.className='modalbg';bg.id='detailBg';
 bg.innerHTML=`<div class="modal"><div class="dhead">${safeImg(r.photo)?`<img src="${safeImg(r.photo)}">`:''}<div><b style="font-size:17px">${esc(r.full_name)}</b><div class="hint">رقم العضوية ${r.member_no}</div><span class="badge ${r.status==='active'?'b-on':'b-off'}">${r.status==='active'?'نشط':'غير نشط'}</span></div></div>
 ${rowsTable(r)}
 <div class="field"><label>صورة إثبات الهوية</label>${safeImg(r.id_photo)?`<div class="idbox" onclick="showImg('${r.id}')"><img src="${safeImg(r.id_photo)}"><div class="hint">اضغط للتكبير</div></div>`:'<div class="hint">لا توجد صورة.</div>'}</div>
 <div class="btnrow"><button class="btn outline small" onclick="previewAdminCard('${r.id}')">معاينة بطاقة PDF</button><button class="btn outline small" onclick="toggleStatus('${r.id}',true)">${r.status==='active'?'تعليق النشاط':'تفعيل'}</button><button class="btn small" onclick="document.getElementById('detailBg').remove()">إغلاق</button></div></div>`;
 document.body.appendChild(bg);
}
function showImg(id){
 const r=records.find(x=>x.id===id);
 const bg=document.createElement('div');bg.className='modalbg';bg.style.zIndex=70;bg.onclick=()=>bg.remove();
 bg.innerHTML=`<img src="${safeImg(r.id_photo)}" style="max-width:100%;max-height:92vh;border-radius:10px;background:#fff">`;
 document.body.appendChild(bg);
}
async function previewAdminCard(id){const r=await getFull(id);previewCard(r)}
async function toggleStatus(id,fromModal){
 const r=records.find(x=>x.id===id),ns=r.status==='active'?'inactive':'active';
 const {error}=await sb.from('volunteer_members').update({status:ns}).eq('id',id);
 if(error){alert('تعذر تغيير الحالة.');return}
 r.status=ns;if(fromModal)document.getElementById('detailBg')?.remove();render();
}
function adminResetPass(id){
 const r=records.find(x=>x.id===id);if(!r)return;
 const bg=document.createElement('div');bg.className='modalbg';bg.id='rpBg';
 bg.innerHTML=`<div class="modal" style="width:min(420px,100%)"><h3>تعيين كلمة مرور جديدة</h3><div class="hint" style="margin-bottom:10px">للمنتسب: <b>${esc(r.full_name)}</b></div><div id="rpMsg"></div>
 <div class="field"><label>كلمة المرور الجديدة (6 خانات على الأقل)</label><input id="rp_p" type="text" autocomplete="off" autocapitalize="none"></div>
 <div class="btnrow"><button class="btn" onclick="adminResetSave('${r.id}')">حفظ</button><button class="btn outline" onclick="document.getElementById('rpBg').remove()">إلغاء</button></div></div>`;
 document.body.appendChild(bg);
}
async function adminResetSave(id){
 const p=document.getElementById('rp_p').value,box=document.getElementById('rpMsg');
 if(p.length<6){box.innerHTML='<div class="msg err">كلمة المرور يجب ألا تقل عن 6 خانات.</div>';return}
 const {error}=await sb.rpc('admin_set_member_password',{p_id:id,p_new:p});
 if(error){box.innerHTML='<div class="msg err">تعذر الحفظ: '+esc(error.message||'')+'</div>';return}
 document.getElementById('rpBg').remove();alert('تم تعيين كلمة المرور. أبلغ المنتسب بها.');
}
async function del(id){
 if(!confirm('هل تريد حذف المنتسب نهائيًا؟'))return;
 const {error}=await sb.from('volunteer_members').delete().eq('id',id);
 if(error){alert('تعذر الحذف.');return}
 await loadRecords();render();
}
async function exportPdfAll(){
 const m=filtered();if(!m.length){alert('لا توجد بيانات بالفلتر الحالي.');return}
 if(m.length>60&&!confirm(`سيتم إنشاء ${m.length} صفحة وقد يستغرق ذلك وقتًا. متابعة؟`))return;
 const pages=[];for(const r of m){const f=await getFull(r.id);pages.push(cardHtml(f))}
 await htmlToPdfPages(pages,`members_${new Date().toISOString().slice(0,10)}.pdf`);
}
function exportCSV(){
 const m=filtered(),h=['رقم العضوية','الاسم','الرقم الوطني','تاريخ الميلاد','العمر','مكان الميلاد','البلدية','العنوان','رقم البطاقة','رقم الجواز','الهاتف','واتساب','البريد','المؤهل','المؤسسة','أعمال تطوعية','دورات','لغات','المهارات','الحالة','ملاحظات','تاريخ الانتساب'];
 const rows=m.map(r=>[r.member_no,r.full_name,r.national_id,r.dob,ageOf(r.dob),r.birth_place,r.municipality,r.address,r.id_card_no,r.passport_no,r.phone,r.whatsapp,r.email,r.qualification,r.institution,(r.volunteer_work||[]).join(' | '),(r.courses||[]).join(' | '),r.languages,skillsText(r),r.status==='active'?'نشط':'غير نشط',r.notes,fmtDate(r.created_at)]);
 const csv=[h,...rows].map(row=>row.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));a.download='members.csv';a.click();
}

/* ---------- التوجيه ---------- */
function render(){
 navSync();
 if(!CONFIGURED){shell('<div class="panel"><h3>المنظومة تحتاج إعدادًا</h3><div class="msg err">ضع قيمتي SUPABASE_URL و SUPABASE_KEY في أعلى كود الملف، وشغّل ملف volunteer-setup.sql في Supabase.</div></div>');return}
 ({home,register:registerPage,memberLogin:memberLoginPage,forgot:forgotPage,adminLogin:adminLoginPage,profile:profilePage,edit:editPage,success:successPage,dashboard}[view]||home)();
}
async function init(){
 if(!CONFIGURED)return render();
 const v=new URLSearchParams(location.search).get('verify');
 if(v)return verifyPage(v);
 shell('<div class="empty">جارِ التحميل...</div>');
 const {data}=await sb.auth.getSession();
 if(data?.session){admin=data.session.user;await loadRecords();view='dashboard'}
 render();
}
init();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body></html>
